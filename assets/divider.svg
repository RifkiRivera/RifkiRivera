<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8a5cff"/>
      <stop offset="75%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="11" width="1000" height="2" fill="url(#line)" filter="url(#g)"/>

  <!-- moving light pulse -->
  <circle cy="12" r="4" fill="#ffffff" filter="url(#g)">
    <animate attributeName="cx" values="0;1000" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- center diamond -->
  <rect x="494" y="6" width="12" height="12" fill="#05070f" stroke="#00f0ff" stroke-width="2" transform="rotate(45 500 12)">
    <animate attributeName="stroke" values="#00f0ff;#ff2bd6;#00f0ff" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
