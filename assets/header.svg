<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="50%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#140a2a"/>
    </linearGradient>

    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8a5cff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-400 0; 400 0; -400 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0; 0 40" dur="3s" repeatCount="indefinite"/>
    </pattern>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2bd6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="typeClip">
      <rect x="60" y="190" height="40" width="0">
        <animate attributeName="width" values="0;470;470;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>

  <!-- pulsing glow orbs -->
  <circle cx="150" cy="60" r="150" fill="url(#glowA)">
    <animate attributeName="r" values="120;180;120" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="230" r="160" fill="url(#glowB)">
    <animate attributeName="r" values="140;200;140" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- floating particles -->
  <g fill="#00f0ff">
    <circle cx="120" cy="220" r="2"><animate attributeName="cy" values="270;10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="250" r="1.5"><animate attributeName="cy" values="280;10" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="240" r="2"><animate attributeName="cy" values="280;10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="260" r="1.5" fill="#ff2bd6"><animate attributeName="cy" values="280;10" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="250" r="2" fill="#8a5cff"><animate attributeName="cy" values="280;10" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scan line -->
  <rect x="0" y="0" width="1000" height="3" fill="#00f0ff" opacity="0.35">
    <animate attributeName="y" values="-5;285" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#00f0ff" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M 24 60 L 24 24 L 60 24"/>
    <path d="M 940 24 L 976 24 L 976 60"/>
    <path d="M 24 220 L 24 256 L 60 256"/>
    <path d="M 940 256 L 976 256 L 976 220"/>
  </g>

  <!-- top tag -->
  <text x="60" y="70" font-family="'Courier New', monospace" font-size="16" fill="#00f0ff" letter-spacing="4" opacity="0.85">
    &gt; SYSTEM.ONLINE
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- main title -->
  <text x="60" y="150" font-family="'Courier New', monospace" font-size="72" font-weight="700" fill="url(#neon)" filter="url(#glow)" letter-spacing="6">
    RIFKI RIVERA
  </text>

  <!-- typing subtitle -->
  <g clip-path="url(#typeClip)">
    <text x="60" y="218" font-family="'Courier New', monospace" font-size="26" fill="#e6f7ff" letter-spacing="3">
      &gt; FULLSTACK DEVELOPER
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="60" y="196" width="14" height="28" fill="#00f0ff">
    <animate attributeName="x" values="60;530;530;60" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- right side HUD ring -->
  <g transform="translate(850 140)" fill="none" filter="url(#glow)">
    <circle r="70" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="30 12" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="32" stroke="#8a5cff" stroke-width="3" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#00f0ff" stroke="none">
      <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
